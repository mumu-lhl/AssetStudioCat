name: Avalonia GUI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    name: Verify tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test AppCore
        run: dotnet test AssetStudio.AppCore.Tests/AssetStudio.AppCore.Tests.csproj --configuration Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            archive: zip
          - runner: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - runner: macos-latest
            rid: osx-x64
            archive: tar.gz
          - runner: macos-latest
            rid: osx-arm64
            archive: tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        if: matrix.rid == 'win-x64'
        uses: microsoft/setup-msbuild@v2

      - name: Install Autodesk FBX SDK
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" `
            -OutFile "$env:RUNNER_TEMP/fbxsdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/fbxsdk.exe" -ArgumentList "/S" -Wait

      - name: Build Windows FBX native library
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: msbuild AssetStudioFBXNative/AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish AssetStudioGUI.Avalonia/AssetStudioGUI.Avalonia.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output "artifacts/publish/${{ matrix.rid }}" `
            -p:Version="$version" `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create release archive
        shell: pwsh
        run: |
          if ("${{ matrix.rid }}" -eq "win-x64") {
            Copy-Item `
              "AssetStudioFBXNative/bin/x64/Release/AssetStudioFBXNative.dll" `
              "artifacts/publish/${{ matrix.rid }}/AssetStudioFBXNative.dll"
          }
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $baseName = "AssetStudioCat-${{ github.ref_name }}-${{ matrix.rid }}"
          if ("${{ matrix.archive }}" -eq "zip") {
            Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/release/$baseName.zip"
          } else {
            tar -czf "artifacts/release/$baseName.tar.gz" -C "artifacts/publish/${{ matrix.rid }}" .
          }

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioCat-${{ matrix.rid }}
          path: artifacts/release/*
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: AssetStudioCat-*
          path: artifacts/release
          merge-multiple: true
          skip-decompress: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts/release
        run: sha256sum AssetStudioCat-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/release/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "AssetStudioCat ${{ github.ref_name }}"
