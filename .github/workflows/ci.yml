name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 9 & 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore tests
        run: dotnet restore AssetStudio.AppCore.Tests/AssetStudio.AppCore.Tests.csproj

      - name: Restore Avalonia GUI
        run: dotnet restore AssetStudioGUI.Avalonia/AssetStudioGUI.Avalonia.csproj

      - name: Restore CLI
        run: dotnet restore AssetStudioCLI/AssetStudioCLI.csproj

      - name: Run AppCore tests
        run: dotnet test AssetStudio.AppCore.Tests/AssetStudio.AppCore.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Build Avalonia GUI
        run: dotnet build AssetStudioGUI.Avalonia/AssetStudioGUI.Avalonia.csproj --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build AssetStudioCLI/AssetStudioCLI.csproj --configuration Release --no-restore

      - name: Publish CLI
        shell: pwsh
        run: |
          dotnet publish AssetStudioCLI/AssetStudioCLI.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output "artifacts/cli" `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioModCLI-${{ matrix.rid }}
          path: artifacts/cli
          if-no-files-found: error
          retention-days: 7
